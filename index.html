<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immanuel Lutheran Church · Oshkosh, WI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf9f5; --cream:#f3ede2; --cream-2:#ebe3d4; --white:#fff;
  --ink:#1c1f23; --muted:#4b5057; --line:#e1d9ca; --line-2:#d3c9b6;
  --teal:#1c6670; --teal-dark:#134b52; --teal-soft:#e4f0f1;
  --gold:#94733a; --wine:#7b2433; --wine-soft:#f6e9eb;
  --deep:#15353a;
  --ok:#1f6b43; --ok-soft:#e3f3ea; --warn:#8a5a00; --warn-soft:#fdf1d6; --bad:#a3162a; --bad-soft:#fbe4e7;
  --focus:#1a5fd0; --fs:19px; --barh:56px;
  --serif:"Crimson Pro",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
html.size-lg{--fs:22px} html.size-xl{--fs:25px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);line-height:1.6;color:var(--ink);background:var(--paper)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0 0 .4em;color:var(--ink)}
h2{font-size:clamp(2rem,4.2vw,2.6rem)} h3{font-size:1.5rem}
p{margin:0 0 1em}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--teal);text-underline-offset:3px;text-decoration-thickness:1.5px}
a:hover{color:var(--teal-dark)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ===== Presentation bar (not part of the real site) ===== */
.demobar{position:sticky;top:0;z-index:200;background:#111;color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 14px;font:15px/1.3 system-ui,sans-serif}
.dgrp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demobar .lbl{color:#aaa;font-weight:600}
.seg{display:inline-flex;background:#2a2a2a;border-radius:9px;padding:3px;gap:2px}
.seg button{background:transparent;color:#ddd;border:0;border-radius:7px;padding:7px 13px;font:600 14px system-ui,sans-serif}
.seg button[aria-pressed="true"]{background:#fff;color:#111}
.barbtn{background:none;border:1px solid #555;color:#ddd;border-radius:8px;padding:6px 12px;font:14px system-ui,sans-serif}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:54px;padding:.55em 1.35em;border-radius:6px;font-weight:700;font-size:1rem;text-decoration:none;border:2px solid transparent;line-height:1.2;text-align:center;letter-spacing:.01em}
.btn svg{width:1.15em;height:1.15em}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark);color:#fff}
.btn-outline{border-color:var(--teal);color:var(--teal);background:transparent}
.btn-outline:hover{background:var(--teal-soft)}
.btn-white{background:#fff;color:var(--teal-dark)}
.btn-sm{min-height:42px;padding:.35em .9em;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.eyebrow{font-family:var(--sans);font-size:.8rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 .6em}
.muted{color:var(--muted)}
.link-arrow{font-weight:700;text-decoration:none}
.link-arrow::after{content:" →"}

/* ===== Stage ===== */
.stage{background:var(--paper)}
.stage.phone{background:#d8d4cc;padding:26px 12px 48px;display:flex;justify-content:center}
.site{container:site / inline-size;background:var(--paper);color:var(--ink)}
.stage.phone .site{width:400px;max-width:100%;height:820px;overflow:auto;border:12px solid #111;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.site section[id]{scroll-margin-top:90px}
.stage:not(.phone) .site section[id]{scroll-margin-top:calc(var(--barh) + 90px)}
.sec{padding:80px 0}
.sec.tint{background:var(--cream)}
.sec-head{max-width:680px;margin-bottom:36px}
.sec-head.center{margin-left:auto;margin-right:auto;text-align:center}
.sec-head p{color:var(--muted);font-size:1.08rem}

/* utility bar + header */
.s-util{background:var(--cream);font-size:.85rem;border-bottom:1px solid var(--line)}
.s-util .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px 20px;flex-wrap:wrap;min-height:44px;padding-top:4px;padding-bottom:4px}
.s-util .contact{display:flex;gap:22px;flex-wrap:wrap}
.s-util a{color:var(--ink);text-decoration:none;display:inline-flex;gap:7px;align-items:center}
.s-util a svg{width:15px;height:15px;color:var(--teal)}
.textsize{display:flex;align-items:center;gap:5px}
.textsize button{background:#fff;border:1px solid var(--line-2);border-radius:5px;min-width:36px;min-height:34px;font-weight:700;color:var(--ink)}
.textsize button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.s-header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.stage:not(.phone) .s-header{top:var(--barh)}
.s-header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:84px;gap:16px;position:relative}
.brand{display:flex;align-items:center;text-decoration:none;color:var(--ink)}
.brand img{height:46px;width:auto}
.brand .brand-txt{display:none;font-family:var(--serif);font-size:1.3rem;font-weight:700;line-height:1.05}
.brand .brand-txt small{display:block;font-family:var(--sans);font-size:.7rem;font-weight:400;color:var(--muted)}
.brand.noimg img{display:none} .brand.noimg .brand-txt{display:block}
.s-nav{display:flex;gap:4px;align-items:center}
.s-nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;padding:10px 10px;border-bottom:2px solid transparent}
.s-nav a:hover{color:var(--teal);border-bottom-color:var(--teal)}
.s-nav .btn{margin-left:10px;text-transform:none;letter-spacing:0;font-size:.95rem;border-bottom:2px solid transparent;color:#fff;padding:.5em 1.1em;min-height:46px}
.s-nav .btn:hover{color:#fff}
.menu-btn{display:none;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);padding:8px 14px;min-height:50px;border-radius:6px;font-weight:700}
.menu-btn svg{width:22px;height:22px}

/* hero */
.hero{background:var(--cream);padding:64px 0 76px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.sign{font-family:var(--serif);font-weight:600;font-size:clamp(2.4rem,5.4cqi,4rem);line-height:1.06;margin:0 0 .35em;letter-spacing:-.01em}
.verse-ref{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--muted);margin-bottom:1.4em}
.hero-info{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:1.02rem;margin-bottom:28px;padding:14px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.hero-info span{display:inline-flex;align-items:center;gap:8px}
.hero-info svg{width:20px;height:20px;color:var(--teal)}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.photo{position:relative;background:var(--cream-2);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.noimg img{display:none}
.photo.noimg::after{content:"Photo";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-family:var(--serif);font-size:1.3rem}
.hero-photo{position:relative;margin:0}
.hero-photo::before{content:"";position:absolute;inset:22px -22px -22px 22px;border:2px solid var(--gold);opacity:.55}
.hero-photo .photo{aspect-ratio:5/4;box-shadow:0 18px 40px rgba(40,30,10,.18);border:10px solid #fff}
.hero.mini{padding:22px;border-radius:8px}
.hero.mini .hero-grid{grid-template-columns:1.2fr .8fr;gap:22px}
.hero.mini .sign{font-size:1.9rem}
.hero.mini .verse-ref{font-size:1rem;margin-bottom:.6em}
.hero.mini .hero-info{font-size:.85rem;margin:0;padding:8px 0}
.hero.mini .hero-photo::before{inset:10px -10px -10px 10px}
.hero.mini .hero-photo .photo{border-width:5px}

/* service times strip */
.times{background:#fff;border-bottom:1px solid var(--line)}
.times-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.time{padding:26px 22px;border-left:1px solid var(--line)}
.time:first-child{border-left:0;padding-left:0}
.time .d{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.time b{display:block;font-family:var(--serif);font-size:2rem;font-weight:600;line-height:1.1;margin:4px 0 2px}
.time span:last-child{color:var(--muted);font-size:.95rem}

/* bulletin */
.bul-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}
.bul-date{font-size:clamp(2rem,4cqi,2.8rem)}
.bul-occ{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--muted);margin-top:-.2em}
.comm{display:flex;gap:12px;align-items:center;background:var(--wine-soft);border-left:4px solid var(--wine);padding:12px 16px;color:var(--wine);font-weight:700;margin:4px 0 18px}
.comm svg{width:24px;height:24px}
.bul-grid .row{margin:22px 0 6px}
.past{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}
.past summary{cursor:pointer;font-weight:700;color:var(--teal);min-height:46px;display:flex;align-items:center}
.past ul{list-style:none;margin:0;padding:0}
.past li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.paper-wrap{display:flex;justify-content:center;padding:20px}
.paper{width:100%;max-width:330px;aspect-ratio:8.5/11;background:#fffef9;border:1px solid var(--line);box-shadow:0 2px 0 #e9e3d6,0 4px 0 #f3eee4,0 22px 40px rgba(40,30,10,.16);padding:32px 30px;text-align:center;transform:rotate(1.5deg);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.paper:hover{transform:rotate(0)}
.paper .pc{width:30px;height:30px;color:var(--gold);margin:0 auto 6px}
.paper .pn{font-family:var(--serif);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
.paper .pd{font-family:var(--serif);font-size:1rem}
.paper .pt{font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--muted)}
.paper hr{width:40%;border:0;border-top:1px solid var(--line-2);margin:10px auto}
.paper .ln{height:6px;background:#ece6da;border-radius:3px;margin:5px auto}

/* news + upcoming */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.list-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.list-h h2{font-size:2rem;margin:0}
.ev-item{display:flex;gap:18px;padding:16px 0;border-bottom:1px solid var(--line-2);align-items:flex-start}
.cal-date{flex:none;width:64px;text-align:center;background:#fff;border:1px solid var(--line-2)}
.cal-date span{display:block;background:var(--teal);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.1em;padding:3px 0}
.cal-date b{display:block;font-family:var(--serif);font-size:1.8rem;font-weight:600;line-height:1.25}
.ev-item h3{font-size:1.3rem;margin:0 0 2px}
.ev-item p{margin:0;color:var(--muted);font-size:.95rem}
.ann-item{padding:18px 0;border-bottom:1px solid var(--line-2)}
.ann-item h3{font-size:1.3rem;margin:0 0 4px}
.ann-item p{margin:0;color:var(--muted)}
.ann-item.pin h3::before{content:"";display:inline-block;width:8px;height:8px;background:var(--wine);border-radius:50%;margin-right:10px;vertical-align:middle}

/* calendar */
.calbar{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;margin-bottom:22px}
.vseg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:#fff}
.vseg button{border:0;background:transparent;padding:9px 20px;font-weight:700;min-height:46px}
.vseg button+button{border-left:1px solid var(--line-2)}
.vseg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.calfilter{display:flex;align-items:center;gap:10px;font-weight:700}
.calfilter select{font:inherit;min-height:46px;padding:6px 12px;border:1px solid var(--line-2);border-radius:6px;background:#fff}
.agenda{border-top:2px solid var(--ink)}
.ag-day{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line-2)}
.ag-day.today .ag-d{color:var(--teal)}
.ag-d{font-family:var(--serif);font-size:1.2rem;font-weight:600;line-height:1.2}
.ag-d small{display:block;font-family:var(--sans);font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ag-ev{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:4px 0}
.ag-ev+.ag-ev{margin-top:8px}
.ag-t{font-weight:700;color:var(--muted);font-size:.95rem}
.ag-ti{font-weight:700}
.ag-ti i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:1px}
.ag-m{color:var(--muted);font-size:.92rem}
.ag-comm{display:inline-flex;gap:6px;align-items:center;color:var(--wine);font-weight:700;font-size:.85rem;margin-left:6px}
.ag-comm svg{width:16px;height:16px}
.more{margin-top:20px}
.month-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-h h3{margin:0;font-size:1.7rem}
.navbtn{width:48px;height:48px;border-radius:6px;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center}
.navbtn svg{width:22px;height:22px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line-2);border-left:1px solid var(--line-2);background:#fff}
.mgrid .dow{text-align:center;font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:var(--cream)}
.mcell{min-height:104px;background:#fff;border:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;border-radius:0}
.mcell.out{background:#faf8f3;color:#999}
.mcell.today .n{background:var(--teal);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.mcell.sel{box-shadow:inset 0 0 0 3px var(--teal)}
.mcell .n{font-weight:700;font-size:.88rem}
.mbar{display:block;font-size:.72rem;line-height:1.3;border-left:3px solid var(--c);padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 9%,#fff)}
.mmore{font-size:.72rem;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dayview{margin-top:18px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* ministries */
.mins{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.min{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}
.min .photo{aspect-ratio:4/3}
.min .ph-ic{aspect-ratio:4/3;display:grid;place-items:center;background:var(--teal);color:#fff}
.min .ph-ic svg{width:64px;height:64px;opacity:.9}
.min .body{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1}
.min h3{font-size:1.4rem;margin-bottom:.15em}
.min .when{font-weight:700;color:var(--teal);font-size:.95rem;margin-bottom:.6em}
.min p{color:var(--muted);font-size:.95rem}
.min .link-arrow{margin-top:auto;background:none;border:0;padding:0;text-align:left;color:var(--teal);font-size:.95rem}

/* griefshare */
.grief{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.grief .photo{aspect-ratio:940/788;border:1px solid var(--line)}
.grief-when{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:#fff;border:1px solid var(--line-2);border-left:4px solid var(--teal);padding:16px 18px;margin:8px 0 18px}
.grief-when dt{font-weight:700;color:var(--muted)}
.grief-when dd{margin:0;font-weight:700}
.status-line{font-weight:700;color:var(--teal)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 14px}
.person{background:#fff;border:1px solid var(--line-2);padding:14px 16px}
.person b{display:block;font-family:var(--serif);font-size:1.2rem;font-weight:600}
.person a{display:inline-block;padding:2px 0}
.note{font-size:.95rem;background:var(--cream);padding:12px 16px;border-left:4px solid var(--gold)}

/* visit */
.visit{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.visit .photo{aspect-ratio:940/788;border:10px solid #fff;box-shadow:0 14px 30px rgba(40,30,10,.12)}
.expect{list-style:none;margin:0 0 20px;padding:0}
.expect li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.expect li:first-child{padding-top:0}
.expect .ic{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--teal)}
.expect .ic svg{width:22px;height:22px}
.expect b{display:block;font-size:1.05rem}
.expect span{color:var(--muted);font-size:.95rem}
.faq{margin-top:48px;max-width:900px;margin-left:auto;margin-right:auto}
.faq h3{text-align:center;margin-bottom:16px}
details.qa{border-bottom:1px solid var(--line-2)}
details.qa:first-of-type{border-top:1px solid var(--line-2)}
details.qa summary{cursor:pointer;padding:18px 4px;font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:center;min-height:60px}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"+";font-size:1.6rem;font-weight:400;color:var(--teal);line-height:1}
details.qa[open] summary::after{content:"−"}
details.qa>div{padding:0 4px 18px;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.facts{display:flex;gap:0;margin:24px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.facts div{flex:1;padding:14px 0;text-align:center}
.facts div+div{border-left:1px solid var(--line-2)}
.facts b{display:block;font-family:var(--serif);font-size:2rem;font-weight:600;color:var(--teal);line-height:1.1}
.facts span{font-size:.85rem;color:var(--muted)}
.verse-box{background:var(--deep);color:#fff;padding:30px 32px;margin-bottom:22px}
.verse-box p{font-family:var(--serif);font-size:1.45rem;line-height:1.35;margin:0 0 10px}
.verse-box cite{font-style:normal;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;color:#e7cf9b}
.beliefs{margin:0;padding-left:1.3em}
.beliefs li{margin-bottom:8px}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.cinfo{display:grid;gap:18px;margin-bottom:24px}
.cinfo div{display:grid;grid-template-columns:28px 1fr;gap:12px}
.cinfo svg{width:24px;height:24px;color:var(--teal);margin-top:3px}
.cinfo b{display:block}
.hours{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line-2)}
.hours caption{text-align:left;font-family:var(--serif);font-size:1.4rem;font-weight:600;margin-bottom:8px}
.hours th,.hours td{padding:11px 16px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.hours td{text-align:right;font-weight:700}
.hours tr.today{background:var(--teal-soft)}
.hours tr.today th{font-weight:700}
.map{width:100%;aspect-ratio:4/3.4;border:1px solid var(--line-2);background:var(--cream-2)}

/* ============ Data logic ============ */
function occurrences(from,to){
  const out=[];
  for(const e of S.events){
    if(!e.date) continue;
    let d=parse(e.date); const end=e.until?parse(e.until):to; let g=0;
    while(d<=to&&d<=end&&g++<500){
      if(d>=from) out.push({...e,on:new Date(d)});
      if(e.repeat==='weekly') d=addDays(d,7);
      else if(e.repeat==='biweekly') d=addDays(d,14);
      else if(e.repeat==='monthly') d=new Date(d.getFullYear(),d.getMonth()+1,d.getDate());
      else break;
    }
  }
  return out.sort((a,b)=>a.on-b.on||(a.start||'').localeCompare(b.start||''));
}
const hasCommunion=o=>o.cat==='worship'&&S.bulletins.some(b=>b.date===iso(o.on)&&b.communion);
function postedBulletins(){const t=today();return S.bulletins.filter(b=>parse(b.postOn)<=t).sort((a,b)=>b.date.localeCompare(a.date));}
function fileURL(b){
  if(FILES[b.id]) return FILES[b.id];
  if(b.file){try{const[h,d]=b.file.split(',');const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);FILES[b.id]=URL.createObjectURL(new Blob([a],{type:h.slice(5).split(';')[0]}));return FILES[b.id];}catch(e){}}
  return null;
}
function activeAnns(){const t=today();return S.announcements.filter(a=>!a.until||parse(a.until)>=t).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0));}
function griefStatus(g){const t=today(),s=g.start?parse(g.start):null,e=g.end?parse(g.end):null;
  if(s&&t<s) return {txt:`Next session starts ${fmtDay(g.start)}.`,state:'soon'};
  if(e&&t>e) return {txt:'This session has ended. The next session will be posted here.',state:'ended'};
  return {txt:'Now meeting. Call to join — you are welcome here.',state:'now'};}
function nextSeasonChange(){const t=today();const y=t.getFullYear();return [[y,2,1,'Lent & Easter'],[y,5,1,'Summer'],[y,8,1,'Fall'],[y,11,1,'Advent & Christmas'],[y+1,2,1,'Lent & Easter']].map(([a,m,d,n])=>({d:new Date(a,m,d),n})).find(x=>x.d>t);}

function upcomingHTML(){
  const t=today(); const seen=new Set();
  const hi=occurrences(t,addDays(t,75)).filter(o=>o.highlight&&!seen.has(o.id)&&seen.add(o.id));
  const rest=occurrences(t,addDays(t,7)).filter(o=>!o.highlight);
  const list=[...hi,...rest].sort((a,b)=>a.on-b.on).slice(0,5);
  if(!list.length) return '<p class="muted" style="padding:16px 0">Nothing scheduled right now.</p>';
  return list.map(o=>`<div class="ev-item"><div class="cal-date"><span>${o.on.toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</span><b>${o.on.getDate()}</b></div><div><h3>${esc(o.title)}</h3><p>${o.on.toLocaleDateString('en-US',{weekday:'long'})}${o.start?' · '+fmtTime(o.start):''}${o.location?' · '+esc(o.location):''}</p>${o.desc?`<p>${esc(o.desc)}</p>`:''}</div></div>`).join('');
}

function agEv(o){const c=CATS[o.cat]||CATS.other;
  return `<div class="ag-ev"><div class="ag-t">${o.start?fmtTime(o.start):'All day'}</div><div><span class="ag-ti"><i style="--c:${c.c}"></i>${esc(o.title)}</span>${hasCommunion(o)?`<span class="ag-comm">${I.chalice} Holy Communion</span>`:''}
  ${(o.end||o.location||o.desc)?`<div class="ag-m">${o.end?'Until '+fmtTime(o.end):''}${o.end&&o.location?' · ':''}${esc(o.location||'')}${o.desc?`${o.end||o.location?'<br>':''}${esc(o.desc)}`:''}</div>`:''}</div></div>`;}

function renderCal(){
  const el=site.querySelector('#cal-body'); if(!el) return;
  const keep=o=>cal.filter==='all'||o.cat===cal.filter;
  const t=today();
  let html=`<div class="calbar"><div class="vseg" role="group" aria-label="Calendar view"><button type="button" data-act="cal-view" data-v="list" aria-pressed="${cal.view==='list'}">List</button><button type="button" data-act="cal-view" data-v="month" aria-pressed="${cal.view==='month'}">Month</button></div>
    <label class="calfilter">Show: <select data-act="cal-select"><option value="all">All events</option>${Object.entries(CATS).filter(([k])=>k!=='other').map(([k,v])=>`<option value="${k}" ${cal.filter===k?'selected':''}>${v.label}</option>`).join('')}</select></label></div>`;
  if(cal.view==='list'){
    const occ=occurrences(t,addDays(t,cal.days)).filter(keep);
    const by={}; occ.forEach(o=>{(by[iso(o.on)]=by[iso(o.on)]||[]).push(o);});
    const keys=Object.keys(by);
    html+= keys.length?`<div class="agenda">${keys.map(k=>{const d=parse(k);return `<div class="ag-day${k===iso(t)?' today':''}"><div class="ag-d"><small>${k===iso(t)?'Today':d.toLocaleDateString('en-US',{weekday:'long'})}</small>${d.toLocaleDateString('en-US',{month:'long',day:'numeric'})}</div><div>${by[k].map(agEv).join('')}</div></div>`;}).join('')}</div>`:`<p class="muted">Nothing scheduled in the next ${cal.days} days.</p>`;
    html+=`<div class="more"><button type="button" class="btn btn-outline" data-act="cal-more">Show more dates</button></div>`;
  } else {
    const m=new Date(t.getFullYear(),t.getMonth()+cal.month,1);
    const start=addDays(m,-m.getDay()); const end=addDays(start,41);
    const occ=occurrences(start,end).filter(keep);
    const by={}; occ.forEach(o=>{(by[iso(o.on)]=by[iso(o.on)]||[]).push(o);});
    html+=`<div class="month-h"><button type="button" class="navbtn" data-act="cal-month" data-d="-1" aria-label="Previous month">${I.left}</button><h3>${m.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3><button type="button" class="navbtn" data-act="cal-month" data-d="1" aria-label="Next month">${I.right}</button></div>
    <div class="mgrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}
    ${Array.from({length:42},(_,i)=>{const d=addDays(start,i),k=iso(d),evs=by[k]||[];
      return `<button type="button" class="mcell${d.getMonth()!==m.getMonth()?' out':''}${k===iso(t)?' today':''}${cal.sel===k?' sel':''}" data-act="cal-day" data-day="${k}" aria-label="${fmtDay(k)}, ${evs.length} event${evs.length===1?'':'s'}"><span class="n">${d.getDate()}</span>${evs.slice(0,3).map(o=>`<span class="mbar" style="--c:${(CATS[o.cat]||CATS.other).c}">${esc(o.title)}</span>`).join('')}${evs.length>3?`<span class="mmore">+${evs.length-3} more</span>`:''}<span class="dots">${evs.slice(0,4).map(o=>`<i style="--c:${(CATS[o.cat]||CATS.other).c}"></i>`).join('')}</span></button>`;}).join('')}</div>
    <div class="legend">${Object.entries(CATS).filter(([k])=>k!=='other').map(([k,v])=>`<span><i style="--c:${v.c}"></i>${v.label}</span>`).join('')}</div>`;
    const sel=cal.sel&&(by[cal.sel]||[]);
    html+=`<div class="dayview">${cal.sel?`<div class="agenda"><div class="ag-day"><div class="ag-d"><small>${parse(cal.sel).toLocaleDateString('en-US',{weekday:'long'})}</small>${fmtMD(cal.sel)}</div><div>${sel.length?sel.map(agEv).join(''):'<p class="muted" style="margin:0">Nothing scheduled.</p>'}</div></div></div>`:'<p class="muted">Tap a day to see what\'s happening.</p>'}</div>`;
  }
  el.innerHTML=html;
}

/* Bulletin viewer */
function openBulletin(id,download){
  const b=S.bulletins.find(x=>x.id===id); if(!b) return;
  const url=fileURL(b);
  if(url){ if(download){const a=document.createElement('a');a.href=url;a.download=`Immanuel-Bulletin-${b.date}.pdf`;document.body.appendChild(a);a.click();a.remove();} else window.open(url,'_blank','noopener'); return; }
  if(download){toast('This is a sample. Once the office uploads the real PDF, it downloads here.');return;}
  openModal(`<h2 id="modalTitle" style="font-size:1.8rem">Bulletin · ${fmtMD(b.date)}</h2>
    <p class="demo-tip">Sample only. When the office uploads the real bulletin PDF, it opens here instead.</p>
    <div class="sample-bul"><p style="text-align:center;margin:0"><b style="font-family:var(--serif);font-size:1.2rem;letter-spacing:.08em">IMMANUEL LUTHERAN CHURCH</b><br>${fmtLong(b.date)}${b.title?`<br><em>${esc(b.title)}</em>`:''}</p>
      ${b.communion?`<p class="comm" style="margin-top:14px">${I.chalice} Holy Communion</p>`:''}
      <h4>Order of Service</h4><ol><li>Opening Hymn</li><li>Confession and Absolution</li><li>Readings</li><li>Sermon</li><li>Prayers</li>${b.communion?'<li>The Lord\'s Supper</li>':''}<li>Closing Hymn</li></ol>
      <h4>Announcements</h4><ul>${activeAnns().map(a=>`<li>${esc(a.title)}</li>`).join('')||'<li>None this week</li>'}</ul></div>`);
}
function openModal(html){const m=$('#modal');$('#modalBox').innerHTML=`<button type="button" class="modal-x" data-act="close-modal" aria-label="Close">${I.x}</button>`+html;m.hidden=false;$('.modal-x').focus();}
function closeModal(){$('#modal').hidden=true;}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-act="close-modal"]'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});

function scrollSite(id){
  if(id==='top'){ if(device==='phone') site.scrollTo({top:0,behavior:'smooth'}); else window.scrollTo({top:0,behavior:'smooth'}); return; }
  const el=site.querySelector('#'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
site.addEventListener('click',e=>{
  const ts=e.target.closest('.textsize button'); if(ts){setSize(ts.dataset.size);return;}
  if(e.target.closest('.s-nav a')){const n=site.querySelector('.s-nav');n.classList.remove('open');const mb=site.querySelector('.menu-btn');mb.setAttribute('aria-expanded','false');mb.querySelector('span').textContent='Menu';}
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='SELECT') return;
  const act=b.dataset.act;
  if(act==='menu'){const n=site.querySelector('.s-nav');const o=n.classList.toggle('open');b.setAttribute('aria-expanded',o);b.querySelector('span').textContent=o?'Close':'Menu';}
  else if(act==='view-bul') openBulletin(b.dataset.id,false);
  else if(act==='dl-bul') openBulletin(b.dataset.id,true);
  else if(act==='cal-view'){cal.view=b.dataset.v;renderCal();}
  else if(act==='cal-filter'){cal.filter=b.dataset.cat;renderCal();if(b.dataset.scroll)scrollSite('s-cal');}
  else if(act==='cal-more'){cal.days+=14;renderCal();}
  else if(act==='cal-month'){cal.month+=Number(b.dataset.d);cal.sel=null;renderCal();}
  else if(act==='cal-day'){cal.sel=b.dataset.day;renderCal();}
  else if(act==='go-admin') setView('admin');
});
site.addEventListener('change',e=>{if(e.target.dataset.act==='cal-select'){cal.filter=e.target.value;renderCal();}});

/* Text size */
function setSize(s){document.documentElement.classList.remove('size-lg','size-xl');if(s)document.documentElement.classList.add(s);try{localStorage.setItem('ilc-size',s);}catch(e){}syncTextSize();}
function syncTextSize(){const cur=document.documentElement.classList.contains('size-xl')?'size-xl':document.documentElement.classList.contains('size-lg')?'size-lg':'';document.querySelectorAll('.textsize button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size===cur));}
try{const s=localStorage.getItem('ilc-size');if(s)document.documentElement.classList.add(s);}catch(e){}

/* Save handlers */
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
function readImage(file){return readURL(file).then(src=>new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1600/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));};img.onerror=rej;img.src=src;}));}
const H={
  async bul(fd){
    let id=fd.get('id'); const date=fd.get('date');
    if(!id){const same=S.bulletins.find(b=>b.date===date);if(same)id=same.id;}
    let b=S.bulletins.find(x=>x.id===id); const isNew=!b; if(!b){b={id:uid()};S.bulletins.push(b);}
    Object.assign(b,{date,postOn:fd.get('postOn'),title:fd.get('title').trim(),communion:fd.get('communion')==='on'});
    const f=fd.get('file');
    if(f&&f.size){FILES[b.id]=URL.createObjectURL(f);b.sample=false;b.file=f.size<1500000?await readURL(f):null;}
    const live=parse(b.postOn)<=today();
    return {msg:live?'Bulletin saved — it\'s live on the website now.':`Bulletin saved — it will appear ${fmtDay(b.postOn)}.`,log:`${isNew?'Added':'Updated'} the bulletin for ${fmtShort(b.date)}`,go:'s-bulletin'};
  },
  event(fd){
    let e=S.events.find(x=>x.id===fd.get('id')); const isNew=!e; if(!e){e={id:uid()};S.events.push(e);}
    Object.assign(e,{title:fd.get('title').trim(),cat:fd.get('cat'),date:fd.get('date'),start:fd.get('start'),end:fd.get('end'),repeat:fd.get('repeat'),until:fd.get('until'),location:fd.get('location').trim(),desc:fd.get('desc').trim(),highlight:fd.get('highlight')==='on',sample:false});
    cal.filter='all';
    return {msg:isNew?'Added to the calendar.':'Event updated.',log:`${isNew?'Added':'Updated'} “${e.title}” on the calendar`,go:e.highlight?'s-events':'s-cal'};
  },
  ann(fd){
    let a=S.announcements.find(x=>x.id===fd.get('id')); const isNew=!a; if(!a){a={id:uid()};S.announcements.unshift(a);}
    Object.assign(a,{title:fd.get('title').trim(),body:fd.get('body').trim(),until:fd.get('until'),pin:fd.get('pin')==='on',sample:false});
    return {msg:isNew?'Announcement posted.':'Announcement updated.',log:`${isNew?'Posted':'Updated'} announcement “${a.title}”`,go:'s-events'};
  },
  front(fd){
    const img=fd.get('image');
    if(img==='upload'){if(pendingUpload)S.front.upload=pendingUpload; if(!S.front.upload){toast('Please choose a photo to upload first.');return null;}}
    Object.assign(S.front,{image:img,sign:fd.get('sign').trim(),ref:fd.get('ref').trim(),season:fd.get('season').trim(),changedAt:iso(today())});
    pendingUpload=null;
    return {msg:'Front page updated.',log:'Changed the front page picture and message',go:'top'};
  },
  grief(fd){
    const g=S.grief;
    Object.assign(g,{session:fd.get('session').trim(),start:fd.get('start'),end:fd.get('end'),when:fd.get('when').trim(),note:fd.get('note').trim(),flyer:fd.get('flyer').trim(),show:fd.get('show')==='on',
      c1:{name:fd.get('c1name').trim(),phone:fd.get('c1phone').trim(),email:fd.get('c1email').trim()},c2:{name:fd.get('c2name').trim(),phone:fd.get('c2phone').trim(),email:fd.get('c2email').trim()}});
    const ev=S.events.find(e=>e.linked==='grief'); if(ev&&g.start){ev.date=g.start;ev.until=g.end;ev.sample=false;}
    return {msg:'GriefShare updated — calendar dates updated too.',log:`Updated GriefShare (${g.session})`,go:g.show?'s-grief':'top'};
  },
  group(fd){
    let g=S.groups.find(x=>x.id===fd.get('id')); const isNew=!g; if(!g){g={id:uid()};S.groups.push(g);}
    Object.assign(g,{name:fd.get('name').trim(),cat:fd.get('cat'),img:fd.get('img'),when:fd.get('when').trim(),desc:fd.get('desc').trim(),contact:fd.get('contact').trim(),show:fd.get('show')==='on'});
    return {msg:isNew?'Group added.':'Group updated.',log:`${isNew?'Added':'Updated'} the group “${g.name}”`,go:'s-groups'};
  },
  user(fd){
    let u=S.users.find(x=>x.id===fd.get('id')); const isNew=!u;
    const role=fd.get('role');
    if(u&&u.role==='admin'&&role!=='admin'&&S.users.filter(x=>x.role==='admin').length<2){toast('You need at least one administrator.');return null;}
    if(!u){u={id:uid()};S.users.push(u);}
    Object.assign(u,{name:fd.get('name').trim(),email:fd.get('email').trim(),role});
    return {msg:isNew?`${u.name} added. (Real site: an invite email is sent.)`:'Saved.',log:`${isNew?'Gave website access to':'Updated access for'} ${u.name}`};
  },
  settings(fd){
    ['phone','email','address','cityState','pastor','pastorPhone','worship','facebook','times','hours'].forEach(k=>S.settings[k]=fd.get(k).trim());
    return {msg:'Church info saved.',log:'Updated church info and times',go:'s-contact'};
  },
};

admin.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  let r; try{r=await H[f.dataset.form](new FormData(f),f);}catch(err){toast('Something went wrong reading that file. Please try again.');return;}
  if(!r) return;
  if(r.log) addLog(r.log);
  const ok=save(); edit=null; renderSite(); renderAdmin(); window.scrollTo({top:0,behavior:'smooth'});
  toast(r.msg+(ok?'':' (Demo: this file is too big to keep after a refresh.)'),r.go);
});
admin.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  if(b.tagName==='A') e.preventDefault();
  if(act==='login'){session=b.dataset.id;page='overview';edit=null;renderAdmin();window.scrollTo(0,0);}
  else if(act==='logout'){session=null;edit=null;renderAdmin();}
  else if(act==='see-site') setView('public');
  else if(act==='nav'){page=b.dataset.page;edit=null;pendingUpload=null;renderAdmin();window.scrollTo(0,0);}
  else if(act==='cancel-edit'){edit=null;renderAdmin();}
  else if(act==='edit'){edit={type:b.dataset.type,id:b.dataset.id};renderAdmin();window.scrollTo({top:0,behavior:'smooth'});}
  else if(act==='del'){
    const map={bul:'bulletins',event:'events',ann:'announcements',group:'groups',user:'users'};const arr=S[map[b.dataset.type]];const item=arr.find(x=>x.id===b.dataset.id);if(!item)return;
    const name=item.title||item.name||fmtShort(item.date);
    if(b.dataset.type==='user'&&item.role==='admin'&&S.users.filter(x=>x.role==='admin').length<2){toast('You need at least one administrator.');return;}
    if(!confirm(`Delete “${name}”? This removes it from the website.`))return;
    arr.splice(arr.indexOf(item),1); addLog(`Deleted “${name}”`); save(); edit=null; renderSite(); renderAdmin(); toast('Deleted.');
  }
});
admin.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-bdate'&&t.value){const p=$('#f-bpost');if(p)p.value=iso(addDays(parse(t.value),-3));}
  if(['f-sign','f-ref','f-season'].includes(t.id)) updateMini();
  if(t.id==='f-sign') $('#f-signc').textContent=t.value.length;
});
admin.addEventListener('change',async e=>{
  const t=e.target;
  if(t.name==='image') updateMini();
  if(t.id==='f-photo'&&t.files[0]){
    try{pendingUpload=await readImage(t.files[0]);}catch(err){toast('That file could not be opened as a picture.');return;}
    const r=admin.querySelector('input[name=image][value=upload]'); if(r) r.checked=true;
    const sw=$('#upsw'); if(sw) sw.innerHTML=imgTag(pendingUpload,'');
    updateMini();
  }
});
function updateMini(){
  const m=$('#mini'); if(!m) return; const fd=new FormData(admin.querySelector('form[data-form=front]'));
  const img=fd.get('image'); const temp={...S.front,image:img,sign:fd.get('sign'),ref:fd.get('ref'),season:fd.get('season'),upload:img==='upload'?(pendingUpload||S.front.upload):S.front.upload};
  if(img==='upload'&&!temp.upload) temp.image='building';
  m.innerHTML=heroHTML(temp,true);
}

/* ============ Toast, views, device ============ */
let toastTimer;
function toast(msg,go){
  $('#toastMsg').textContent=msg; const btn=$('#toastBtn');
  btn.hidden=!go||view==='public'; btn.onclick=()=>{setView('public');setTimeout(()=>scrollSite(go),60);$('#toast').classList.remove('show');};
  $('#toast').classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),go?7000:4000);
}
function setView(v){
  view=v; stage.hidden=v!=='public'; admin.hidden=v!=='admin'; $('#devseg').hidden=v!=='public';
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
  if(v==='admin') renderAdmin(); history.replaceState(null,'',v==='admin'?'#admin':location.pathname+location.search);
  window.scrollTo(0,0); site.scrollTop=0; setBarH();
}
function setDevice(d){device=d;stage.classList.toggle('phone',d==='phone');window.scrollTo(0,0);document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.device===d));site.scrollTop=0;}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>setDevice(b.dataset.device)));
$('#resetDemo').addEventListener('click',()=>{if(!confirm('Reset the demo back to the starting content?'))return;try{localStorage.removeItem(KEY);}catch(e){}S=seed();Object.keys(FILES).forEach(k=>delete FILES[k]);session=null;edit=null;pendingUpload=null;Object.assign(cal,{view:'list',filter:'all',month:0,days:14,sel:null});renderSite();renderAdmin();toast('Demo reset.');});

renderSite(); setView(view); setBarH();
